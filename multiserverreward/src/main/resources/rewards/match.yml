### 試合報酬設定 ###

# !!!!! 注意 !!!!!
# plugins内の設定ファイルは使用されません。
# config.yml内の連携用ファイルの保存先ディレクトリに設定ファイルを保存してください。

# 参加賞(勝敗関係なし)
match-end:
  commands:
    - "minecraft:give <player> minecraft:emerald 1"

# 試合勝利
match-win:
  commands:
    - "minecraft:give <player> minecraft:end_crystal 1"

# 試合敗北
match-lose:
  commands: []

# ==============================
# ゲームルール別の追加報酬 (任意)
# ==============================
# 試合のゲームルール名ごとに、上の通常報酬に「追加で」付与する報酬を設定できます。
# 設定場所: rules.<ルール名>.<match-end|match-win|match-lose>
# 例: rules.tdm.match-win.commands: ...
# team_death_match, team_death_match_nolimit, leader_death_match, leader_death_match_point, custom_death_match, hijack

rules:
  team_death_match_point:
    match-end:
      commands:
        - "minecraft:give <player> minecraft:gold_ingot 1"
    match-win:
      commands:
        - "minecraft:give <player> minecraft:diamond 1"
    match-lose:
      commands:
        - "minecraft:give <player> minecraft:iron_ingot 1"

# 期間限定にも同様に設定できます。
# limited-time:
#   example:
#     start: "2026-02-01 00:00:00"
#     end:   "2026-02-29 23:59:59"
#     rules:
#       tdm:
#         match-win:
#           commands:
#             - "minecraft:give <player> minecraft:nether_star 1"
